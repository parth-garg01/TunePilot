[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soup-orchestrator"
version = "0.1.0"
description = "Autonomous LLM Fine-Tuning Orchestrator (local control plane, cloud GPU execution)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Orchestrator Team"}]
keywords = ["llm", "fine-tuning", "orchestrator", "soup", "kaggle"]

dependencies = [
  "typer>=0.12",
  "click>=8.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
huggingface = ["huggingface_hub>=0.23", "datasets>=2.19", "transformers>=4.41", "tokenizers>=0.19"]
kaggle = ["kaggle>=1.6"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
tunepilot = "orchestrator.cli.main:main"
soup-orchestrator = "orchestrator.cli.main:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
